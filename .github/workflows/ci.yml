name: Validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -q
      - run: node --check src/oncosignal/static/app.js
  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oncosignal .
      - run: docker run -d --name onco -p 8010:8010 oncosignal
      - run: curl --retry 15 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8010/health
